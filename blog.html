---
layout: default
title: Blogs
description: List of blogs
---

<h1>Blogs</h1>

<div>
    {% for post in site.posts %}
        <h2>
            <a href="{{post.url}}">{{ post.title }}</a>
        </h2>
        <p style="margin-bottom: 0">
            {{ post.excerpt }}
        </p>
        <a href="{{post.url}}">Read more</a>
    {% endfor %}
</div>
